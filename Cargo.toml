[workspace]
members = ["."]
resolver = "2"

[package]
name = "stainless"
version = "0.2.3"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
description = "StainlessSteel — a harness built with rust"
publish = false

[dependencies]
clap = { version = "=4.5.50", features = ["derive"] }
clap_complete = "=4.5.67"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde_json = "=1.0.145"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = "s"
